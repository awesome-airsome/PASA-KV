architecture: fastwam_direct
checkpoint_env: PASA_KV_FASTWAM_CHECKPOINT
candidate_layers: [0, 30] # half-open range [start, end)
patch:
  size_hw: [50, 50]
  xy: [5, 160]
  view: current_primary
  training_clip_frame: 0
  deployment: each_current_observation
inference:
  action_denoising_steps: 10
method:
  probe_exposures_per_layer: 100
  scoring_pairs_per_task: 1
  tail_fraction: 0.005
  probe_objective: relative_joint_kv
  final_objective: mean_selected_layer_relative_joint_kv
  final_exposures: 10000
  batch_size: 1
  fresh_final_patch: true
  discard_probe_optimizer_state: true
optimizer:
  name: AdamW
  learning_rate: 0.0005
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  weight_decay: 0.01
  schedule: constant
  gradient_clipping: false
  gradient_accumulation: 1
patch_pixels:
  initialization: uniform_0_1
  clamp_after_each_update: [0.0, 1.0]
  image_l1_weight: 0.0
seeds:
  protocol_run_label: 42
  probe_seed_reference: 42
  final_train_seed: 42
  eval_seed: 42
evaluation:
  suite: libero_10
  trials_per_task: 50
  trial_ids: [0, 49] # inclusive reference range
reference_topk_layers:
  top3: [29, 2, 3]
  top4: [29, 2, 3, 1]
  top5: [29, 2, 3, 1, 24]
