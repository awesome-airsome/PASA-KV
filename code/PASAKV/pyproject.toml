[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pasakv-reference"
version = "0.1.0"
description = "Reference implementation of action-facing visual K/V route selection and patch optimization."
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
